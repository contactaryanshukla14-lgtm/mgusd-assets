<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <radialGradient id="bgGrad" cx="45%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#4B8FE2"/>
      <stop offset="100%" stop-color="#1A4FBB"/>
    </radialGradient>
    <clipPath id="circle">
      <circle cx="16" cy="16" r="15.5"/>
    </clipPath>
  </defs>

  <!-- Background circle -->
  <circle cx="16" cy="16" r="15.5" fill="url(#bgGrad)"/>

  <!-- Left bracket ( -->
  <text x="4.2" y="18.5" font-family="Arial, sans-serif" font-weight="bold" font-size="16" fill="white" opacity="1">(</text>

  <!-- Dollar sign $ -->
  <text x="11.5" y="18.2" font-family="Arial, sans-serif" font-weight="bold" font-size="11" fill="white">$</text>

  <!-- Right bracket ) -->
  <text x="22.2" y="18.5" font-family="Arial, sans-serif" font-weight="bold" font-size="16" fill="white">)</text>

  <!-- Divider line -->
  <line x1="7" y1="21.5" x2="25" y2="21.5" stroke="white" stroke-width="0.6" opacity="0.8"/>

  <!-- MGUSD text -->
  <text x="16" y="27.5" font-family="Arial, sans-serif" font-weight="bold" font-size="5" fill="white" text-anchor="middle" letter-spacing="1">MGUSD</text>
</svg>
